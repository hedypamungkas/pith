name: release

# Publishes @use-pith/core to npm via Trusted Publishing (keyless OIDC) when a
# `v*` tag is pushed. No long-lived NPM_TOKEN secret: npm trusts this workflow
# because a trusted publisher is configured on the package (npmjs.com →
# @use-pith/core → Settings → Trusted Publisher → hedypamungkas/pith +
# workflow `release.yml`). Requires npm CLI >= 11.5.1 (Node 24 bundles it).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  # Required for Trusted Publishing: lets Actions mint a short-lived OIDC token
  # that npm both authenticates the publish with AND signs the package's build
  # provenance.
  id-token: write

jobs:
  publish:
    name: Publish @use-pith/core
    runs-on: ubuntu-latest
    # Guard against accidental tags on non-default branches.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          # Node 24 bundles npm >= 11.5.1, required for Trusted Publishing.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Trusted Publishing's keyless *publish auth* needs npm >= 11.5.1; Node 24
      # bundles ~11.3, so upgrade explicitly. (Provenance signing is older and
      # works without this — which is why a too-old npm signs provenance but
      # still 401/404s the publish.)
      - name: Upgrade npm (>= 11.5.1 for Trusted Publishing)
        run: npm install -g npm@latest

      # Keyless publish — no NPM_TOKEN / NODE_AUTH_TOKEN. Trusted Publishing +
      # provenance are implicit via id-token: write + the package's trusted
      # publisher config. publishConfig.access=public handles public access.
      - name: Publish
        run: npm publish -w @use-pith/core

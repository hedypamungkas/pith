name: release

# Publishes @use-pith/core to the public npm registry when a `v*` tag is pushed.
# Tags are cut manually after a release is staged on main.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  # Required for npm provenance: lets Actions mint a short-lived OIDC token
  # that npm uses to sign the package with build provenance.
  id-token: write

jobs:
  publish:
    name: Publish @use-pith/core
    runs-on: ubuntu-latest
    # Guard against accidental tags on non-default branches.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Provenance notes:
      #  - `--provenance` signs the package with an OIDC token minted by GitHub
      #    Actions. No long-lived publish token is needed *for the signature*,
      #    but npm still requires an auth token (NPM_TOKEN, an automation token)
      #    configured in repo secrets to authenticate the publish.
      #  - `--access public` is required because @use-pith/core is a *public* scoped
      #    package. The first publish fails without it. (It is also set in
      #    packages/core/package.json publishConfig, but we pass it explicitly.)
      #  - For fully keyless "trusted publishing" you'd switch to npm's OIDC
      #    trusted-publishing flow and drop NPM_TOKEN entirely; we use the
      #    standard NPM_TOKEN + provenance combo for now.
      - name: Publish
        run: npm publish -w @use-pith/core --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

name: adapters-nightly

# The PG_DATABASE_URL-gated @use-pith/adapters-pg integration suite (real
# Postgres). Runs on a schedule (and manually), NEVER on push/PR — it needs a
# container and must never block a code change. The key-free PGlite unit suite
# runs in ci.yml; this nightly exercises the real-Postgres paths the
# single-threaded WASM DB can't: FOR UPDATE serialization and multi-connection
# parallelism, plus the engine restart-survival E2E.
on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    env:
      PG_DATABASE_URL: postgres://pith:pith@127.0.0.1:55432/pith_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pith
          POSTGRES_PASSWORD: pith
          POSTGRES_DB: pith_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U pith -d pith_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # Scope to the adapter's integration-real tests — avoids pulling in core's
      # Playwright/browser suite (the adapter's restart-survival crawl mocks the
      # SSRF guard and stays on the static tier, no headless browser needed).
      - run: npx vitest run --project integration-real packages/adapters-pg

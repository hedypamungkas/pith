name: adapters-nightly

# The container-gated adapter integration suites (real Postgres + real MinIO).
# Runs on a schedule (and manually), NEVER on push/PR — they need containers
# and must never block a code change. The key-free PGlite / FakeMinioStore unit
# suites run in ci.yml; these nightlies exercise the real-Postgres / real-MinIO
# paths the in-process fakes can't: FOR UPDATE serialization, multi-connection
# parallelism, real S3 semantics, and the engine restart-survival E2E.
on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    env:
      PG_DATABASE_URL: postgres://pith:pith@127.0.0.1:55432/pith_test
      MINIO_ENDPOINT: 127.0.0.1
      MINIO_PORT: "9100"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: pith-test
      REDIS_URL: redis://127.0.0.1:55379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # Stand up both services via the same compose used locally. `--wait`
      # blocks until the postgres healthcheck is healthy; minio has no
      # healthcheck command (the image lacks curl), so its readiness is handled
      # by the tests retrying `ensureBucket` in beforeAll.
      - run: docker compose -f scripts/docker-compose.adapters.yml up -d --wait
      - run: npx vitest run --project integration-real packages/adapters-pg
      - run: npx vitest run --project integration-real packages/adapters-minio
      - run: npx vitest run --project integration-real packages/adapters-bullmq
      - name: Tear down services
        if: always()
        run: docker compose -f scripts/docker-compose.adapters.yml down

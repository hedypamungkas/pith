name: Feature request
description: Suggest a new capability or improvement
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Please search existing [issues](https://github.com/hedypamungkas/pith/issues) and [Discussions](https://github.com/hedypamungkas/pith/discussions) first to avoid duplicates.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that Pith currently makes hard or impossible?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like Pith to do, and how would callers use it?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds, other libraries, or approaches you've ruled out.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mocks, links, related issues, anything else.
    validations:
      required: false

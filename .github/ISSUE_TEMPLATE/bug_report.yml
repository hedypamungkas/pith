name: Bug report
description: Report a defect in @pith/core
title: "[bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report!
        Before opening an issue, please skim [`docs/ARCHITECTURE.md`](https://github.com/pith-core/pith/blob/main/docs/ARCHITECTURE.md) and the OpenAPI spec served by `@pith/core/http` — many questions about behavior, the SDK/HTTP/MCP surfaces, and the zero-infra defaults are answered there.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A concise description of what's broken.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal reproduction. A runnable snippet is ideal.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include error messages and stack traces if any.
      render: shell
    validations:
      required: true
  - type: dropdown
    id: face
    attributes:
      label: Interface affected
      description: Which Pith surface are you using?
      options:
        - SDK (`createEngine` / `@pith/core`)
        - HTTP (Fastify, `@pith/core/http`)
        - MCP (`@pith/core/mcp`)
        - Other / not sure
    validations:
      required: true
  - type: input
    id: pith-version
    attributes:
      label: "@pith/core version"
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: "20.x"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: OS, package manager, relevant config, related Discussions/PRs. Anything else.
    validations:
      required: false
